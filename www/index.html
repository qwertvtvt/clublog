<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Endpoint Tester</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      background: #f3f5f2;
      color: #202923;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-image: linear-gradient(135deg, #f3f5f2 0%, #e8eee8 100%);
    }

    main {
      width: min(760px, 100% - 32px);
      margin: 0 auto;
      padding: 48px 0;
    }

    h1 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .subtitle { margin: 8px 0 30px; color: #5e6b62; }

    section {
      padding: 22px 0;
      border-top: 1px solid #cbd4cc;
    }

    h2 { margin: 0 0 16px; font-size: 17px; }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label { display: grid; gap: 7px; color: #46534a; font-size: 14px; }

    input {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #aebbb0;
      border-radius: 4px;
      background: #fff;
      color: #202923;
      font: inherit;
    }

    input:focus { outline: 2px solid #27724c; outline-offset: 1px; }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }

    button {
      min-height: 40px;
      padding: 8px 14px;
      border: 1px solid #27724c;
      border-radius: 4px;
      background: #27724c;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button.secondary { background: transparent; color: #245c3e; }
    button:hover { filter: brightness(.94); }
    button:disabled { cursor: wait; opacity: .6; }

    .endpoint { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .endpoint code { color: #56665a; font-size: 14px; }

    #result {
      min-height: 120px;
      margin: 0;
      padding: 16px;
      overflow: auto;
      border: 1px solid #35443a;
      border-radius: 4px;
      background: #17231b;
      color: #e0eee4;
      font: 13px/1.6 Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 560px) {
      main { padding: 30px 0; }
      .fields { grid-template-columns: 1fr; }
      .endpoint { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <h1>API Endpoint Tester</h1>
    <p class="subtitle">Clublog API の応答とログインセッションを確認します。</p>

    <section aria-labelledby="auth-title">
      <h2 id="auth-title">ユーザー認証</h2>
      <form id="credentials-form">
        <div class="fields">
          <label>ユーザー名
            <input id="username" name="username" autocomplete="username" required>
          </label>
          <label>パスワード
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
        </div>
        <div class="actions">
          <button type="button" data-action="register">POST /api/auth/register</button>
          <button type="button" class="secondary" data-action="login">POST /api/auth/login</button>
        </div>
      </form>
    </section>

    <section aria-label="API endpoints">
      <div class="endpoint">
        <code>GET /api/users/me</code>
        <button type="button" class="secondary" data-action="me">実行</button>
      </div>
      <div class="endpoint" style="margin-top: 14px">
        <code>POST /api/auth/logout</code>
        <button type="button" class="secondary" data-action="logout">実行</button>
      </div>
      <div class="endpoint" style="margin-top: 14px">
        <code>GET /api/test</code>
        <button type="button" class="secondary" data-action="test">実行</button>
      </div>
    </section>

    <section aria-labelledby="result-title">
      <h2 id="result-title">レスポンス</h2>
      <pre id="result" aria-live="polite">実行結果がここに表示されます。</pre>
    </section>
  </main>

  <script>
    const result = document.querySelector("#result");
    const credentialsForm = document.querySelector("#credentials-form");

    async function callEndpoint(action) {
      const username = document.querySelector("#username").value;
      const password = document.querySelector("#password").value;
      const options = { method: "GET", credentials: "same-origin" };

      if (action === "register" || action === "login") {
        if (!credentialsForm.reportValidity()) return;
        options.method = "POST";
        options.headers = { "Content-Type": "application/json" };
        options.body = JSON.stringify({ username, password });
      } else if (action === "logout") {
        options.method = "POST";
      }

      const button = document.querySelector(`[data-action="${action}"]`);
      button.disabled = true;
      const endpoint = action === "me" ? "/api/users/me" :
        action === "test" ? "/api/test" : `/api/auth/${action}`;
      result.textContent = `${options.method} ${endpoint}\n送信中...`;

      try {
        const response = await fetch(endpoint, options);
        const body = await response.text();
        let formattedBody = body;
        try {
          formattedBody = JSON.stringify(JSON.parse(body), null, 2);
        } catch {}
        result.textContent = `HTTP ${response.status} ${response.statusText}\n\n${formattedBody || "(empty response)"}`;
      } catch (error) {
        result.textContent = `リクエストに失敗しました\n${error.message}`;
      } finally {
        button.disabled = false;
      }
    }

    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => callEndpoint(button.dataset.action));
    });
  </script>
</body>
</html>
